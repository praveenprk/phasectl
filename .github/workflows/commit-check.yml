name: Commit check

# The PR title, description and every commit a PR brings to main follow
# eng-principles ENG-STD-005 §1 (format, anchors that resolve, no co-author
# or tool attribution). The check is eng-principles' shared workflow,
# pinned to a commit (ENG-DEC-009). phasectl's policy is
# scripts/hooks/types and scripts/hooks/anchors. Its `questions` job
# fails a PR into main while docs/QUESTIONS.md has an OPEN entry
# (ENG-DEC-010, ENG-DEC-012).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  commit-check:
    uses: praveenprk/eng-principles/.github/workflows/commit-check.yml@86d9e76c8a119d691a2ed98273ee9833500c499d
    with:
      config: scripts/hooks

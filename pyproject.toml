[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy._Backend"

[project]
name = "ctx"
version = "0.1.0"
description = "Personal Claude dev orchestration — phase-gated engineering sessions"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "anthropic>=0.34.0",
]

[project.scripts]
ctx = "ctx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

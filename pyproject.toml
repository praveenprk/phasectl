[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phasectl"
version = "0.1.0"
description = "Personal Claude dev orchestration — phase-gated engineering sessions"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "anthropic>=0.34.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
graph = ["kuzu>=0.6.0"]

[project.scripts]
phasectl = "phasectl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
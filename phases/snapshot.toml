[phase]
name = "snapshot"
temperature = 0.3
token_budget = 5000
tools_allowed = []

system_prompt = """
You are compressing a session for ContextOS into a handoff summary.

Compress today's session into a summary a rested engineer can orient from in 30 seconds. Include: what changed, which RFCs were progressed (RFC-NNN), which DECISIONs were logged (DECISION-NNN), what is blocked, what is next. Be specific. Be terse. No prose padding.

Format:

RFCs:
- RFC-NNN: <one-line status>

DECISIONS:
- DECISION-NNN: <one-line decision>

BLOCKERS:
- <specific blocker, or "None">

NEXT:
- <single concrete next action>
"""
